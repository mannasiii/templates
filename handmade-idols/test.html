<body>
    <div id="header"></div>

 

<main class="services-ui">

  <!-- Common Page Banner -->
  <section class="about-v2-banner">
    <div class="about-v2-banner-content">
      <h1>Services</h1>
      <p>
        <a href="index.html">Home</a>
        <span>/</span>
        Services
      </p>
    </div>
  </section>

  <!-- Services Section -->
  <section class="services-ui-section">

    <div class="services-ui-heading">
      <span>WHAT WE OFFER</span>
      <h2>Explore Our Services</h2>
      <p>
        Art, creativity and craftsmanship — made with love.
      </p>
    </div>

<div class="services-ui-list" id="servicesList">
    <p class="services-ui-loading">Loading services...</p>
</div>

  </section>

  <!-- Floating Cart Button -->
  <button class="services-ui-cart-trigger" id="servicesCartTrigger">
    <i class="fa fa-shopping-bag"></i>
    <span>Cart</span>
    <b id="servicesCartCount">0</b>
  </button>

  <!-- Cart Overlay -->
  <div class="services-ui-overlay" id="servicesCartOverlay"></div>

  <!-- Cart Side Drawer -->
  <aside class="services-ui-drawer" id="servicesCartDrawer">

    <div class="services-ui-drawer-head">
      <div>
        <span>YOUR SELECTION</span>
        <h3>Shopping Cart</h3>
      </div>
      <button type="button" id="servicesCartClose"
              aria-label="Close cart">&times;</button>
    </div>

    <div class="services-ui-cart-items" id="servicesCartItems">
      <div class="services-ui-empty">
        <i class="fa fa-shopping-bag"></i>
        <p>Your cart is empty.</p>
        <span>Add a service to get started.</span>
      </div>
    </div>

    <div class="services-ui-cart-bottom">
      <div class="services-ui-total">
        <span>Total Amount</span>
        <strong id="servicesCartTotal">₹0</strong>
      </div>

      <button type="button" class="services-ui-whatsapp"
              id="servicesWhatsApp">
        <i class="fa fa-whatsapp"></i> WhatsApp Enquiry
      </button>

      <button type="button" class="services-ui-email"
              id="servicesEmail">
        <i class="fa fa-envelope"></i> Email Enquiry
      </button>
    </div>

  </aside>

</main>


    <div id="footer"></div>
<script src="assets/js/is.js"></script>
    <script>
        // Load Header
        fetch("header.html")
            .then(response => response.text())
            .then(data => document.getElementById("header").innerHTML = data);

        // Load Footer
        fetch("footer.html")
            .then(response => response.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
</body>
